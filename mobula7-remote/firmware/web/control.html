<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mobula7</title>
<style>
:root{--bg:#0f1413;--pad:#18201e;--line:#34413d;--ink:#e6eeea;--muted:#8fa19a;--arm:#e5482a;--ok:#4fbf7f;--warn:#e0a548;--knob:#6fb3d4}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px -apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px}
#status{flex:1;text-align:center;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--pad);border:1px solid var(--line)}
#status.armed{background:var(--arm);border-color:var(--arm);color:#fff}
#status.killed{color:var(--warn);border-color:var(--warn)}
#status.calib{color:var(--knob);border-color:var(--knob)}
#status.nolink{color:var(--muted)}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--pad);border:1px solid var(--line);border-radius:8px;padding:8px 14px;touch-action:none}
button:disabled{opacity:.35}
#beep.on{background:var(--warn);color:#000}
main{flex:1;display:flex;gap:12px;padding:0 12px 12px;direction:ltr}
.pad{flex:1;position:relative;background:var(--pad);border:1px solid var(--line);border-radius:16px;touch-action:none;overflow:hidden}
.pad .lbl{position:absolute;top:8px;width:100%;text-align:center;font-size:13px;color:var(--muted);direction:rtl}
.pad .val{position:absolute;bottom:8px;width:100%;text-align:center;font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.knob{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--knob);opacity:.85;left:50%;top:50%;pointer-events:none}
#rotate{display:none;position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;text-align:center;font-size:20px;padding:24px}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<header>
  <button id="calib" type="button">כיול אופק</button>
  <div id="status" class="nolink">אין קשר לשלט</div>
  <button id="beep" type="button">BEEP</button>
</header>
<main>
  <div class="pad" id="left"><div class="lbl">גז · סיבוב</div><div class="knob"></div><div class="val"></div></div>
  <div class="pad" id="right"><div class="lbl">הטיה</div><div class="knob"></div><div class="val"></div></div>
</main>
<div id="rotate">סובב את הטלפון לרוחב</div>
<script>
(function () {
  'use strict';
  var LO = 1000, MID = 1500, HI = 2000;
  var sticks = { roll: MID, pitch: MID, throttle: LO, yaw: MID };
  var beep = false, calibOnce = false, lastRx = 0, ws = null, retry = null;
  window.__m7 = { sticks: sticks };

  function clamp(v) { return Math.max(LO, Math.min(HI, Math.round(v))); }

  // Floating sticks: values follow the drag distance from where the finger
  // landed, so touching never makes the drone jump. Throttle keeps its value
  // on release; everything else recentres.
  function bindPad(el, onMove, onRelease) {
    var knob = el.querySelector('.knob'), active = null;
    function rel(e) {
      var r = el.getBoundingClientRect();
      return { dx: e.clientX - active.x, dy: e.clientY - active.y, w: r.width, h: r.height };
    }
    el.addEventListener('pointerdown', function (e) {
      if (active) return;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      active = { id: e.pointerId, x: e.clientX, y: e.clientY, t0: sticks.throttle };
      e.preventDefault();
    });
    function move(e) {
      if (!active || e.pointerId !== active.id) return;
      var d = rel(e);
      onMove(d, active);
      var r = el.getBoundingClientRect();
      knob.style.left = Math.max(0, Math.min(r.width, r.width / 2 + d.dx)) + 'px';
      knob.style.top = Math.max(0, Math.min(r.height, r.height / 2 + d.dy)) + 'px';
      e.preventDefault();
    }
    function up(e) {
      if (!active || e.pointerId !== active.id) return;
      active = null;
      onRelease();
      knob.style.left = '50%';
      knob.style.top = '50%';
    }
    el.addEventListener('pointermove', move);
    window.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }

  bindPad(document.getElementById('left'),
    function (d, a) {
      sticks.throttle = clamp(a.t0 - (d.dy / d.h) * (HI - LO));
      sticks.yaw = clamp(MID + (d.dx / (d.w / 2)) * 500);
    },
    function () { sticks.yaw = MID; });
  bindPad(document.getElementById('right'),
    function (d) {
      sticks.roll = clamp(MID + (d.dx / (d.w / 2)) * 500);
      sticks.pitch = clamp(MID - (d.dy / (d.h / 2)) * 500);
    },
    function () { sticks.roll = MID; sticks.pitch = MID; });

  var beepBtn = document.getElementById('beep');
  beepBtn.addEventListener('pointerdown', function (e) { beep = true; beepBtn.classList.add('on'); e.preventDefault(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) {
    beepBtn.addEventListener(t, function () { beep = false; beepBtn.classList.remove('on'); });
  });
  var calibBtn = document.getElementById('calib');
  calibBtn.addEventListener('click', function () { if (!calibBtn.disabled) calibOnce = true; });

  var statusEl = document.getElementById('status');
  function setStatus(cls, text) { statusEl.className = cls; statusEl.textContent = text; }
  function onStatus(t) {
    var p = t.split(',');
    if (p[0] !== 'T' || p.length !== 4) return;
    lastRx = Date.now();
    var armed = p[1] === '1', killed = p[2] === '1', calib = p[3] === '1';
    calibBtn.disabled = armed || killed || calib;
    if (calib) setStatus('calib', 'מכייל – הרחפן על משטח ישר');
    else if (armed) setStatus('armed', 'חמוש');
    else if (killed) setStatus('killed', 'KILL – שחרר כפתורים ואז ARM');
    else setStatus('', 'נעול – לחץ ARM בשלט');
  }

  var params = new URLSearchParams(location.search);
  var wsUrl = params.get('ws') || ('ws://' + location.hostname + ':81/');
  function connect() {
    if (ws || document.hidden) return;
    ws = new WebSocket(wsUrl);
    ws.onmessage = function (e) { if (typeof e.data === 'string') onStatus(e.data); };
    ws.onclose = function () { ws = null; if (!retry) retry = setTimeout(function () { retry = null; connect(); }, 1000); };
    ws.onerror = function () { try { ws.close(); } catch (_) {} };
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (ws) { var w = ws; ws = null; w.onclose = null; w.close(); } }
    else connect();
  });

  var vals = document.querySelectorAll('.val');
  setInterval(function () {
    if (ws && ws.readyState === 1) {
      ws.send('S,' + sticks.roll + ',' + sticks.pitch + ',' + sticks.throttle + ',' + sticks.yaw +
              ',' + (beep ? 1 : 0) + ',' + (calibOnce ? 1 : 0));
      calibOnce = false;
    }
    if (Date.now() - lastRx > 1000) { setStatus('nolink', 'אין קשר לשלט'); calibBtn.disabled = false; }
    vals[0].textContent = 'T' + sticks.throttle + ' Y' + sticks.yaw;
    vals[1].textContent = 'R' + sticks.roll + ' P' + sticks.pitch;
  }, 20);
  connect();
})();
</script>
</body>
</html>
